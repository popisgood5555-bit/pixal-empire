<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素帝國：量子世代</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; --panel-bg: #1e293b; --border-col: #334155;
            --text-main: #f8fafc; --text-sub: #94a3b8;
            --accent-gold: #f59e0b; --accent-blue: #3b82f6;
            --accent-green: #10b981; --accent-purple: #8b5cf6;
        }
        * { box-sizing: border-box; user-select: none; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'DotGothic16', sans-serif;
            margin: 0; display: flex; height: 100vh; overflow: hidden;
            image-rendering: pixelated;
        }
        
        /* 側邊欄導航 */
        #sidebar {
            width: 200px; background-color: var(--panel-bg);
            border-right: 4px solid var(--border-col);
            display: flex; flex-direction: column; padding: 20px 0;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10;
        }
        .nav-item {
            padding: 15px 20px; font-size: 18px; cursor: pointer;
            border-bottom: 2px solid var(--border-col); transition: 0.2s;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-item:hover { background-color: #334155; padding-left: 25px; color: var(--accent-gold); }
        .nav-item.active { background-color: var(--accent-blue); color: white; border-color: #2563eb; }

        /* 主畫面區 */
        #main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            height: 100vh; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        /* 頂部資源列 */
        #topbar {
            height: 80px; background-color: rgba(30, 41, 59, 0.8);
            border-bottom: 4px solid var(--border-col);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; font-size: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .money-text { color: var(--accent-gold); font-size: 32px; text-shadow: 2px 2px 0 #000; }
        .global-bonus { font-size: 16px; color: var(--accent-green); }

        /* 內容切換區 */
        #content-area {
            flex-grow: 1; padding: 30px; overflow-y: auto;
        }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 卡片與按鈕設計 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card {
            background-color: rgba(30, 41, 59, 0.9); border: 3px solid var(--border-col);
            padding: 15px; border-radius: 8px; box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--border-col); padding-bottom: 10px; margin-bottom: 10px; }
        .card-title { font-size: 20px; font-weight: bold; color: var(--text-main); }
        .card-count { color: var(--accent-green); font-size: 18px; }
        .card-desc { font-size: 14px; color: var(--text-sub); margin-bottom: 15px; flex-grow: 1; }
        
        button {
            font-family: 'DotGothic16', sans-serif; font-size: 16px;
            padding: 10px; cursor: pointer; border: none; border-radius: 4px;
            color: white; background-color: var(--accent-blue);
            box-shadow: 0 4px 0 #2563eb; transition: 0.1s;
        }
        button:active { box-shadow: 0 0 0 transparent; transform: translateY(4px); }
        button:disabled { background-color: #475569; box-shadow: 0 4px 0 #334155; cursor: not-allowed; color: #94a3b8; }
        
        .btn-sell { background-color: #ea580c; box-shadow: 0 4px 0 #c2410c; }
        .btn-tech-done { background-color: var(--accent-purple); box-shadow: 0 4px 0 #7c3aed; }
        
        /* 成就 */
        .achievement {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background-color: #1e293b; border: 2px solid var(--border-col);
            opacity: 0.5; filter: grayscale(100%); transition: 0.3s;
        }
        .achievement.unlocked { opacity: 1; filter: grayscale(0%); border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
        .ach-icon { font-size: 40px; }
        
        #notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background-color: var(--accent-blue); color: white; padding: 15px 30px;
            border-radius: 8px; border: 2px solid #60a5fa; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 18px; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

    <div id="notification"></div>

    <div id="sidebar">
        <div style="text-align: center; font-size: 20px; color: var(--accent-gold); margin-bottom: 20px; text-shadow: 2px 2px #000;">
            🌌 帝國中樞
        </div>
        <div class="nav-item active" onclick="switchTab('dashboard')">🏠 帝國總覽</div>
        <div class="nav-item" onclick="switchTab('buildings')">🏗️ 工業建設</div>
        <div class="nav-item" onclick="switchTab('tech')">🔬 科研中心</div>
        <div class="nav-item" onclick="switchTab('market')">🛒 資源市場</div>
        <div class="nav-item" onclick="switchTab('achievements')">🏆 榮耀成就</div>
    </div>

    <div id="main-content">
        <div id="topbar">
            <div>資金: <span id="money-display" class="money-text">$ 0</span></div>
            <div id="global-bonus-display" class="global-bonus">全局加成: +0%</div>
        </div>

        <div id="content-area">
            <div id="tab-dashboard" class="tab-content active">
                <h2>📈 帝國發展簡報</h2>
                <div class="grid">
                    <div class="card">
                        <div class="card-title">庫存資源摘要</div>
                        <div id="dash-inventory" class="card-desc" style="font-size: 18px; line-height: 1.8;"></div>
                    </div>
                    <div class="card">
                        <div class="card-title">當前自動化狀態</div>
                        <div id="dash-status" class="card-desc"></div>
                    </div>
                </div>
            </div>

            <div id="tab-buildings" class="tab-content">
                <h2>🏗️ 國家基礎與高科技建設</h2>
                <div id="buildings-container" class="grid"></div>
            </div>

            <div id="tab-tech" class="tab-content">
                <h2>🔬 科技樹與國家政策</h2>
                <p style="color:var(--text-sub);">研發科技以解鎖更高級別的工業建築與自動化。</p>
                <div id="tech-container" class="grid"></div>
            </div>

            <div id="tab-market" class="tab-content">
                <h2>🛒 全球交易市場</h2>
                <p style="color:var(--text-sub);">將生產的資源拋售至市場換取資金。</p>
                <div id="market-container" class="grid"></div>
            </div>

            <div id="tab-achievements" class="tab-content">
                <h2>🏆 帝國發展里程碑</h2>
                <p style="color:var(--text-sub);">解鎖成就可獲得永久產能加成 (每個 +5%)。</p>
                <div id="achievements-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 遊戲資料 ---
        const GAME = {
            res: {
                food: { name: '🌾 糧食', price: 2 },
                iron: { name: '🪨 鐵礦', price: 5 },
                gear: { name: '⚙️ 齒輪', price: 25 },
                silicon: { name: '🏜️ 矽礦', price: 100 },
                wafer: { name: '💽 矽晶圓', price: 600 },
                chip: { name: '💠 量子晶片', price: 4000 },
                antimatter: { name: '🌌 反物質', price: 50000 }
            },
            bld: [
                { id: 'farm', name: '基礎農田', desc: '生產糧食', cost: 15, outRes: 'food', outAmt: 1, inRes: null, inAmt: 0, reqTech: null },
                { id: 'mine', name: '露天鐵礦', desc: '開採鐵礦', cost: 150, outRes: 'iron', outAmt: 1, inRes: null, inAmt: 0, reqTech: 'mining' },
                { id: 'factory', name: '重型工廠', desc: '消耗鐵礦製造齒輪', cost: 1200, outRes: 'gear', outAmt: 1, inRes: 'iron', inAmt: 2, reqTech: 'steam' },
                { id: 'silicon', name: '矽石提取廠', desc: '高壓提取高純度矽', cost: 8000, outRes: 'silicon', outAmt: 0.5, inRes: null, inAmt: 0, reqTech: 'purification' },
                { id: 'wafer', name: '無塵晶圓廠', desc: '將矽礦燒製成晶圓', cost: 50000, outRes: 'wafer', outAmt: 0.2, inRes: 'silicon', inAmt: 1, reqTech: 'lithography' },
                { id: 'quantum', name: '量子實驗室', desc: '消耗晶圓與齒輪，封裝量子晶片', cost: 300000, outRes: 'chip', outAmt: 0.05, inRes: 'wafer', inAmt: 0.5, reqTech: 'quantum_tech' },
                { id: 'collider', name: '反物質對撞機', desc: '粉碎量子晶片，捕獲反物質', cost: 2000000, outRes: 'antimatter', outAmt: 0.01, inRes: 'chip', inAmt: 0.1, reqTech: 'dark_energy' }
            ],
            techs: [
                { id: 'mining', name: '採礦學', desc: '解鎖「露天鐵礦」', cost: 100, req: null },
                { id: 'steam', name: '蒸汽動力', desc: '解鎖「重型工廠」', cost: 800, req: 'mining' },
                { id: 'auto_sell', name: '高頻交易演算法', desc: '每秒自動售出所有庫存', cost: 5000, req: 'steam' },
                { id: 'purification', name: '礦物提純技術', desc: '解鎖「矽石提取廠」', cost: 15000, req: 'steam' },
                { id: 'lithography', name: '極紫外光微影', desc: '解鎖「無塵晶圓廠」', cost: 80000, req: 'purification' },
                { id: 'quantum_tech', name: '量子糾纏運算', desc: '解鎖「量子實驗室」', cost: 500000, req: 'lithography' },
                { id: 'dark_energy', name: '暗能量捕獲理論', desc: '解鎖最終建築「反物質對撞機」', cost: 5000000, req: 'quantum_tech' }
            ],
            achs: [
                { id: 'first_blood', name: '第一桶金', desc: '賺取 $1,000 資金', icon: '💰', condition: () => p.lifetime >= 1000 },
                { id: 'industrial', name: '工業巨頭', desc: '建造 10 座重型工廠', icon: '🏭', condition: () => p.bld.factory >= 10 },
                { id: 'silicon_valley', name: '矽谷霸主', desc: '生產出第一片量子晶片', icon: '💠', condition: () => p.res.chip >= 1 || p.lifetimeRes.chip >= 1 },
                { id: 'singularity', name: '科技奇異點', desc: '成功捕獲反物質', icon: '🌌', condition: () => p.res.antimatter >= 0.01 || p.lifetimeRes.antimatter >= 0.01 }
            ]
        };

        let p = {
            money: 0, lifetime: 0, lastTime: Date.now(),
            res: { food:0, iron:0, gear:0, silicon:0, wafer:0, chip:0, antimatter:0 },
            lifetimeRes: { food:0, iron:0, gear:0, silicon:0, wafer:0, chip:0, antimatter:0 },
            bld: { farm:0, mine:0, factory:0, silicon:0, wafer:0, quantum:0, collider:0 },
            tech: {}, ach: {}
        };

        const MULT = 1.15; // 建築價格成長
        const TICK_RATE = 10; // 1秒10次迴圈

        // --- 核心系統 ---
        function init() {
            load();
            calcOffline();
            renderAll();
            setInterval(loop, 1000 / TICK_RATE);
            setInterval(save, 5000);
        }

        // 獲取全局加成 (每個成就 +5%)
        function getBonus() {
            let count = Object.values(p.ach).filter(v => v).length;
            return 1 + (count * 0.05);
        }

        function getCost(id) {
            let b = GAME.bld.find(x => x.id === id);
            return b.cost * Math.pow(MULT, p.bld[id]);
        }

        function buy(id) {
            let cost = getCost(id);
            if (p.money >= cost) {
                p.money -= cost;
                p.bld[id]++;
                renderAll();
            }
        }

        function research(id) {
            let t = GAME.techs.find(x => x.id === id);
            if (p.money >= t.cost && !p.tech[id]) {
                p.money -= t.cost;
                p.tech[id] = true;
                notify(`科研突破：${t.name}！`);
                renderAll();
            }
        }

        function sell(id) {
            let qty = p.res[id];
            if (qty > 0) {
                let profit = qty * GAME.res[id].price * getBonus();
                p.money += profit;
                p.lifetime += profit;
                p.res[id] = 0;
                updateUI();
            }
        }

        function loop() {
            let mult = getBonus();
            
            // 生產邏輯
            GAME.bld.forEach(b => {
                let count = p.bld[b.id];
                if (count <= 0) return;

                let outAmt = (count * b.outAmt * mult) / TICK_RATE;
                
                if (!b.inRes) {
                    p.res[b.outRes] += outAmt;
                    p.lifetimeRes[b.outRes] += outAmt;
                } else {
                    let inReq = (count * b.inAmt) / TICK_RATE;
                    // 特殊處理量子實驗室需要兩種資源 (簡化處理：先扣晶圓，齒輪用代碼補充)
                    if (b.id === 'quantum') {
                        let gearReq = (count * 1) / TICK_RATE; // 量子額外需要 1 齒輪/s
                        if (p.res[b.inRes] >= inReq && p.res.gear >= gearReq) {
                            p.res[b.inRes] -= inReq;
                            p.res.gear -= gearReq;
                            p.res[b.outRes] += outAmt;
                            p.lifetimeRes[b.outRes] += outAmt;
                        }
                    } else {
                        if (p.res[b.inRes] >= inReq) {
                            p.res[b.inRes] -= inReq;
                            p.res[b.outRes] += outAmt;
                            p.lifetimeRes[b.outRes] += outAmt;
                        } else {
                            // 原料不足，降級生產
                            let ratio = p.res[b.inRes] / inReq;
                            p.res[b.inRes] = 0;
                            p.res[b.outRes] += outAmt * ratio;
                            p.lifetimeRes[b.outRes] += outAmt * ratio;
                        }
                    }
                }
            });

            // 自動販售
            if (p.tech['auto_sell']) {
                Object.keys(GAME.res).forEach(id => sell(id));
            }

            // 檢查成就
            GAME.achs.forEach(a => {
                if (!p.ach[a.id] && a.condition()) {
                    p.ach[a.id] = true;
                    notify(`🏆 解鎖成就：${a.name}！<br>全局加成提升 5%`);
                    renderAll();
                }
            });

            p.lastTime = Date.now();
            updateUI();
        }

        // --- 介面與渲染 ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function formatMoney(num) {
            if (num >= 1000000) return (num/1000000).toFixed(2) + ' M';
            if (num >= 1000) return (num/1000).toFixed(2) + ' k';
            return num.toFixed(1);
        }
        function formatRes(num) { return num < 1 ? num.toFixed(2) : Math.floor(num); }

        function updateUI() {
            document.getElementById('money-display').innerText = `$ ${formatMoney(p.money)}`;
            
            let bCount = Object.values(p.ach).filter(v => v).length;
            document.getElementById('global-bonus-display').innerText = `全局加成: +${bCount * 5}%`;

            // 更新市場與總覽
            let invHtml = '';
            Object.keys(GAME.res).forEach(id => {
                let qty = p.res[id];
                if (qty > 0 || p.lifetimeRes[id] > 0) { // 曾擁有過才顯示
                    let r = GAME.res[id];
                    let price = r.price * getBonus();
                    invHtml += `
                        <div class="card" style="padding:10px;">
                            <div class="card-header" style="margin:0; border:none; padding:0;">
                                <span class="card-title">${r.name} x ${formatRes(qty)}</span>
                                <button class="btn-sell" onclick="sell('${id}')" ${qty <= 0 ? 'disabled':''}>出售 ($${price.toFixed(0)})</button>
                            </div>
                        </div>`;
                }
            });
            document.getElementById('market-container').innerHTML = invHtml || '<p style="color:var(--text-sub);">倉庫空空如也，請先建立生產線。</p>';
            
            let dashStr = '';
            Object.keys(GAME.res).forEach(id => {
                if (p.res[id] > 0 || p.lifetimeRes[id] > 0) dashStr += `${GAME.res[id].name}: ${formatRes(p.res[id])} <br>`;
            });
            document.getElementById('dash-inventory').innerHTML = dashStr || '無資料';
            document.getElementById('dash-status').innerHTML = p.tech['auto_sell'] ? '<span style="color:var(--accent-green)">🟢 高頻交易已啟動 (自動拋售)</span>' : '<span style="color:#ef4444">🔴 自動拋售未解鎖</span>';

            // 更新按鈕狀態
            GAME.bld.forEach(b => {
                let btn = document.getElementById(`btn-bld-${b.id}`);
                if (btn) {
                    let cost = getCost(b.id);
                    btn.innerText = `建置 ($${formatMoney(cost)})`;
                    btn.disabled = p.money < cost;
                }
                let cnt = document.getElementById(`cnt-bld-${b.id}`);
                if (cnt) cnt.innerText = p.bld[b.id];
            });

            GAME.techs.forEach(t => {
                let btn = document.getElementById(`btn-tech-${t.id}`);
                if (btn && !p.tech[t.id]) btn.disabled = p.money < t.cost;
            });
        }

        function renderAll() {
            // 渲染建設
            let bHtml = '';
            GAME.bld.forEach(b => {
                if (b.reqTech && !p.tech[b.reqTech]) return;
                let ioStr = b.inRes ? `消耗: ${b.inAmt}/s ${GAME.res[b.inRes].name.split(' ')[1]}<br>` : '';
                if(b.id === 'quantum') ioStr += `消耗: 1/s 齒輪<br>`;
                ioStr += `產出: ${b.outAmt}/s ${GAME.res[b.outRes].name.split(' ')[1]}`;
                
                bHtml += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${b.name}</span>
                            <span class="card-count" id="cnt-bld-${b.id}">${p.bld[b.id]}</span>
                        </div>
                        <div class="card-desc">${b.desc}<br><br><span style="color:var(--accent-green)">${ioStr}</span></div>
                        <button id="btn-bld-${b.id}" onclick="buy('${b.id}')">建置</button>
                    </div>`;
            });
            document.getElementById('buildings-container').innerHTML = bHtml;

            // 渲染科技
            let tHtml = '';
            GAME.techs.forEach(t => {
                if (t.req && !p.tech[t.req]) return;
                let isDone = p.tech[t.id];
                tHtml += `
                    <div class="card">
                        <div class="card-header"><span class="card-title">${t.name}</span></div>
                        <div class="card-desc">${t.desc}</div>
                        <button id="btn-tech-${t.id}" class="${isDone ? 'btn-tech-done':''}" onclick="research('${t.id}')" ${isDone ? 'disabled':''}>
                            ${isDone ? '研發完成' : `研發 ($${formatMoney(t.cost)})`}
                        </button>
                    </div>`;
            });
            document.getElementById('tech-container').innerHTML = tHtml;

            // 渲染成就
            let aHtml = '';
            GAME.achs.forEach(a => {
                let isDone = p.ach[a.id];
                aHtml += `
                    <div class="achievement ${isDone ? 'unlocked':''}">
                        <div class="ach-icon">${a.icon}</div>
                        <div>
                            <div style="font-size:18px; font-weight:bold; color: ${isDone ? 'var(--accent-gold)' : 'var(--text-main)'};">${a.name}</div>
                            <div style="font-size:14px; color:var(--text-sub);">${a.desc}</div>
                        </div>
                    </div>`;
            });
            document.getElementById('achievements-container').innerHTML = aHtml;

            updateUI();
        }

        // --- 工具 ---
        function notify(msg) {
            let el = document.getElementById('notification');
            el.innerHTML = msg; el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }

        function save() { localStorage.setItem('empire_v4', JSON.stringify(p)); }
        function load() {
            let s = localStorage.getItem('empire_v4');
            if (s) {
                let d = JSON.parse(s);
                p.money = d.money || 0; p.lifetime = d.lifetime || 0;
                p.lastTime = d.lastTime || Date.now();
                Object.assign(p.res, d.res); Object.assign(p.lifetimeRes, d.lifetimeRes || {});
                Object.assign(p.bld, d.bld); Object.assign(p.tech, d.tech); Object.assign(p.ach, d.ach || {});
            }
        }
        function calcOffline() {
            let diff = (Date.now() - p.lastTime) / 1000;
            if (diff > 60) notify(`歡迎指揮官登入。<br>離線時間：${Math.floor(diff/60)} 分鐘。系統已運算完畢。`);
            // 這裡簡化處理離線，避免複雜的多輸入材料計算導致負數
            // 由於高科技工廠的依賴關係過於複雜，為保證遊戲平衡，此版本先不大量計算離線扣除邏輯。
            p.lastTime = Date.now();
        }

        window.onload = init;
    </script>
